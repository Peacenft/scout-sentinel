name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scout_sentinel
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: scout_sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout_sentinel -d scout_sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://scout_sentinel:ci_test_password@127.0.0.1:5432/scout_sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:db:prepare
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t scout-sentinel:ci .
